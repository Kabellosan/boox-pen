name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pen-keyboard-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pen-keyboard-${{ github.run_number }}
          path: pen-keyboard-${{ github.run_number }}.apk

      # On main, publish the APK as a release so it can be downloaded
      # straight from the tablet's browser (Releases page, newest on top).
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "pen-keyboard-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)"
